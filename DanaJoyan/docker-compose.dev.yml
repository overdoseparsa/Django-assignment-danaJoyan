version: "3.9"

services:

  db:
    image: postgres:16
    container_name: postgres-django
    ports:
      - 5431:5432
    environment:
      - POSTGRES_DB=dana
      - POSTGRES_USER=Dana
      - POSTGRES_PASSWORD=Dana123
    volumes:
      - postgres-data-django:/var/lib/postgresql/data/

  # pgadmin:
