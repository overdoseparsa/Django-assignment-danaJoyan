  #     interval: 30s
  #     timeout: 30s
  #     retries: 3

  redis:
    image: redis:latest
    container_name: redis-django
    ports:
      - 6378:6378
    volumes:
      - redis-data-django:/data


volumes:
    postgres-data-django:
    redis-data-django:

